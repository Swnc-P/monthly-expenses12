<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dark SaaS Expense & Budget Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      font-family: 'IBM Plex Sans Thai', 'Plus Jakarta Sans', sans-serif;
      box-sizing: border-box;
    }
    body {
      background-color: #090d16;
      color: #f3f4f6;
      margin: 0;
      padding: 0;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #111827; }
    ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .drag-row-over {
      border-top: 2px solid #3b82f6 !important;
      background-color: rgba(59, 130, 246, 0.08) !important;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // โครงสร้างข้อมูลเริ่มต้นสำหรับเดือนใหม่
    const createDefaultMonthData = () => ({
      essentialLimitPct: 50,
      investmentLimitPct: 20,
      incomes: [
        { id: 'inc-1', name: 'เงินเดือน / รายได้หลัก', amount: 45000 },
        { id: 'inc-2', name: 'รายได้เสริม / ฟรีแลนซ์', amount: 15000 }
      ],
      essentials: [
        { id: 'ess-1', name: 'ค่าที่พัก / น้ำ-ไฟ / อินเทอร์เน็ต', amount: 12000, paid: true },
        { id: 'ess-2', name: 'ค่าอาหารและของใช้ประจำวัน', amount: 10000, paid: false },
        { id: 'ess-3', name: 'ค่าเดินทาง / น้ำมันรถ', amount: 4500, paid: false }
      ],
      investments: [
        { id: 'inv-1', name: 'พอร์ตหุ้นต่างประเทศ / ETF', amount: 8000, paid: true },
        { id: 'inv-2', name: 'เงินออมสำรอง / กองทุน', amount: 4000, paid: false }
      ],
      specials: [
        { id: 'spc-1', name: 'ช้อปปิ้ง / สังสรรค์ / ของใช้ส่วนตัว', amount: 3500, paid: false }
      ]
    });

    const getInitialStore = () => {
      const currentYM = new Date().toISOString().slice(0, 7);
      return {
        activeMonth: currentYM,
        months: {
          [currentYM]: createDefaultMonthData()
        }
      };
    };

    const formatMoney = (num) => {
      const val = Number(num) || 0;
      return val.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    };

    const formatMonthLabel = (ym) => {
      if (!ym || !ym.includes('-')) return ym;
      const [y, m] = ym.split('-');
      const thaiMonths = [
        'มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
        'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'
      ];
      const mIndex = parseInt(m, 10) - 1;
      const thaiYear = parseInt(y, 10) + 543;
      return `${thaiMonths[mIndex] || m} ${thaiYear} (${ym})`;
    };

    function App() {
      // จัดการ URL ของ Google Apps Script
      const [scriptUrl, setScriptUrl] = useState(() => localStorage.getItem('gas_webapp_url') || '');
      const [inputUrl, setInputUrl] = useState(() => localStorage.getItem('gas_webapp_url') || '');
      const [isConnected, setIsConnected] = useState(false);
      const [isConnecting, setIsConnecting] = useState(false);
      const [urlError, setUrlError] = useState('');

      // ข้อมูลหลักทั้งหมดของเว็บ (ทุกเดือนและทุกตัวเลข)
      const [store, setStore] = useState(getInitialStore);
      const [activeTab, setActiveTab] = useState('tables'); // 'tables' | 'summary'
      const [syncStatus, setSyncStatus] = useState('idle'); // 'idle' | 'saving' | 'saved' | 'error'
      const [lastSyncTime, setLastSyncTime] = useState('');
      const [newMonthInput, setNewMonthInput] = useState('');

      // ป้องกันการบันทึกทับตอนเพิ่งดึงข้อมูลครั้งแรก
      const isInitialLoadedRef = useRef(false);
      const saveTimeoutRef = useRef(null);

      // Drag & Drop State
      const [dragInfo, setDragInfo] = useState({ section: null, index: null, overIndex: null });

      // เชื่อมต่อและดึงข้อมูลจาก Google Apps Script URL ทันทีถ้ามี URL ค้างไว้ในเครื่อง
      useEffect(() => {
        if (scriptUrl) {
          connectAndFetchCloudData(scriptUrl);
        }
      }, []);

      // ฟังก์ชันดึงข้อมูลทั้งหมดจาก Google Apps Script
      const connectAndFetchCloudData = async (targetUrl) => {
        const cleanUrl = targetUrl.trim();
        if (!cleanUrl.startsWith('https://script.google.com/macros/s/')) {
          setUrlError('รูปแบบ URL ไม่ถูกต้อง ต้องขึ้นต้นด้วย https://script.google.com/macros/s/... และลงท้ายด้วย /exec');
          return;
        }

        setIsConnecting(true);
        setUrlError('');
        try {
          const response = await fetch(`${cleanUrl}?t=${Date.now()}`, {
            method: 'GET',
            redirect: 'follow'
          });
          const result = await response.json();

          if (result && result.status === 'success') {
            localStorage.setItem('gas_webapp_url', cleanUrl);
            setScriptUrl(cleanUrl);
            setIsConnected(true);

            if (result.payload && result.payload.months && Object.keys(result.payload.months).length > 0) {
              // มีข้อมูลอยู่บน Google Sheets แล้ว ดึงมาใช้ทันที 100%
              setStore(result.payload);
              setLastSyncTime(result.updatedAt || 'ซิงค์ล่าสุดจาก Cloud');
              setSyncStatus('saved');
              isInitialLoadedRef.current = true;
            } else {
              // กรณี Google Sheets ยังว่างเปล่า (เพิ่งสร้างใหม่) ให้ส่งข้อมูลเริ่มต้นขึ้นไปบันทึกทันที
              const initialData = getInitialStore();
              setStore(initialData);
              isInitialLoadedRef.current = true;
              await pushDataToCloud(cleanUrl, initialData);
            }
          } else {
            setUrlError('ไม่สามารถดึงข้อมูลได้: ' + (result.message || 'ตรวจสอบสิทธิ์การ Deploy เป็น Anyone'));
          }
        } catch (err) {
          console.error('Connection Error:', err);
          setUrlError('เชื่อมต่อไม่สำเร็จ กรุณาตรวจสอบว่า URL ลงท้ายด้วย /exec และตั้งค่า Who has access เป็น Anyone แล้ว');
        } finally {
          setIsConnecting(false);
        }
      };

      // ฟังก์ชันส่งข้อมูลทั้งหมดขึ้นไปบันทึกบน Google Apps Script (ใช้ text/plain เพื่อไม่ให้ติด CORS)
      const pushDataToCloud = async (targetUrl, dataToSave) => {
        if (!targetUrl) return;
        setSyncStatus('saving');
        try {
          const response = await fetch(targetUrl, {
            method: 'POST',
            redirect: 'follow',
            headers: {
              'Content-Type': 'text/plain;charset=utf-8'
            },
            body: JSON.stringify({ payload: dataToSave })
          });

          const resJson = await response.json();
          if (resJson && resJson.status === 'success') {
            setSyncStatus('saved');
            setLastSyncTime(resJson.updatedAt || new Date().toLocaleTimeString('th-TH'));
          } else {
            setSyncStatus('error');
          }
        } catch (err) {
          console.error('Auto-save error:', err);
          setSyncStatus('error');
        }
      };

      // ระบบ Auto-Save อัตโนมัติทุกครั้งที่ตัวเลขหรือข้อมูลใน store เปลี่ยนแปลง
      useEffect(() => {
        if (!isConnected || !scriptUrl || !isInitialLoadedRef.current) return;

        setSyncStatus('saving');
        if (saveTimeoutRef.current) clearTimeout(saveTimeoutRef.current);

        saveTimeoutRef.current = setTimeout(() => {
          pushDataToCloud(scriptUrl, store);
        }, 700);

        return () => {
          if (saveTimeoutRef.current) clearTimeout(saveTimeoutRef.current);
        };
      }, [store, isConnected, scriptUrl]);

      // ข้อมูลของเดือนที่กำลังเลือกอยู่
      const activeMonth = store.activeMonth;
      const currentData = store.months[activeMonth] || createDefaultMonthData();

      // ฟังก์ชันอัปเดตข้อมูลเฉพาะเดือนปัจจุบัน
      const updateCurrentMonth = (updater) => {
        setStore((prev) => {
          const currentM = prev.months[prev.activeMonth] || createDefaultMonthData();
          const updatedM = typeof updater === 'function' ? updater(currentM) : updater;
          return {
            ...prev,
            months: {
              ...prev.months,
              [prev.activeMonth]: updatedM
            }
          };
        });
      };

      // คำนวณยอดรวมต่างๆ ของเดือนปัจจุบัน
      const totalIncome = useMemo(() => {
        return (currentData.incomes || []).reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
      }, [currentData.incomes]);

      const totalEssential = useMemo(() => {
        return (currentData.essentials || []).reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
      }, [currentData.essentials]);

      const totalInvestment = useMemo(() => {
        return (currentData.investments || []).reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
      }, [currentData.investments]);

      const totalSpecial = useMemo(() => {
        return (currentData.specials || []).reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
      }, [currentData.specials]);

      const totalAllExpenses = totalEssential + totalInvestment + totalSpecial;
      const netBalance = totalIncome - totalAllExpenses;

      // คำนวณหลอดพลังข้อ 2 (รายจ่ายจำเป็น) และ ข้อ 3 (เงินลงทุน) เทียบกับรายได้รวม (ข้อ 1)
      const essentialPct = totalIncome > 0 ? (totalEssential / totalIncome) * 100 : 0;
      const essentialLimitAmount = (totalIncome * (Number(currentData.essentialLimitPct) || 0)) / 100;
      const essentialOverAmount = totalEssential - essentialLimitAmount;
      const essentialOverPct = essentialPct - (Number(currentData.essentialLimitPct) || 0);

      const investmentPct = totalIncome > 0 ? (totalInvestment / totalIncome) * 100 : 0;
      const investmentLimitAmount = (totalIncome * (Number(currentData.investmentLimitPct) || 0)) / 100;
      const investmentOverAmount = totalInvestment - investmentLimitAmount;
      const investmentOverPct = investmentPct - (Number(currentData.investmentLimitPct) || 0);

      // ฟังก์ชันจัดการแถว (เพิ่ม / ลบ / แก้ไข / สลับตำแหน่ง)
      const handleAddItem = (sectionKey, defaultName) => {
        updateCurrentMonth((m) => ({
          ...m,
          [sectionKey]: [
            ...(m[sectionKey] || []),
            { id: `${sectionKey}-${Date.now()}`, name: defaultName, amount: 0, paid: false }
          ]
        }));
      };

      const handleUpdateItem = (sectionKey, id, field, value) => {
        updateCurrentMonth((m) => ({
          ...m,
          [sectionKey]: (m[sectionKey] || []).map((item) =>
            item.id === id ? { ...item, [field]: value } : item
          )
        }));
      };

      const handleDeleteItem = (sectionKey, id) => {
        updateCurrentMonth((m) => ({
          ...m,
          [sectionKey]: (m[sectionKey] || []).filter((item) => item.id !== id)
        }));
      };

      const handleReorderItems = (sectionKey, fromIndex, toIndex) => {
        if (fromIndex === toIndex || fromIndex === null || toIndex === null) return;
        updateCurrentMonth((m) => {
          const list = [...(m[sectionKey] || [])];
          if (toIndex < 0 || toIndex >= list.length) return m;
          const [moved] = list.splice(fromIndex, 1);
          list.splice(toIndex, 0, moved);
          return { ...m, [sectionKey]: list };
        });
      };

      // Drag Events
      const onDragStart = (e, section, index) => {
        setDragInfo({ section, index, overIndex: index });
        e.dataTransfer.effectAllowed = 'move';
      };

      const onDragOver = (e, section, index) => {
        e.preventDefault();
        if (dragInfo.section !== section) return;
        if (dragInfo.overIndex !== index) {
          setDragInfo((prev) => ({ ...prev, overIndex: index }));
        }
      };

      const onDrop = (e, section, toIndex) => {
        e.preventDefault();
        if (dragInfo.section === section && dragInfo.index !== null) {
          handleReorderItems(section, dragInfo.index, toIndex);
        }
        setDragInfo({ section: null, index: null, overIndex: null });
      };

      const onDragEnd = () => {
        setDragInfo({ section: null, index: null, overIndex: null });
      };

      // การจัดการเดือน (เพิ่มเดือนใหม่ / คัดลอกจากเดือนล่าสุด / ลบเดือน)
      const sortedMonthKeys = useMemo(() => {
        return Object.keys(store.months || {}).sort();
      }, [store.months]);

      const handleAddMonth = (e) => {
        e.preventDefault();
        if (!newMonthInput) return;
        if (store.months[newMonthInput]) {
          setStore((prev) => ({ ...prev, activeMonth: newMonthInput }));
          setNewMonthInput('');
          return;
        }
        // คัดลอกโครงสร้างรายการจากเดือนปัจจุบันเพื่อให้ไม่ต้องพิมพ์ชื่อรายการใหม่
        const template = JSON.parse(JSON.stringify(currentData));
        template.essentials = (template.essentials || []).map((i) => ({ ...i, paid: false }));
        template.investments = (template.investments || []).map((i) => ({ ...i, paid: false }));
        template.specials = (template.specials || []).map((i) => ({ ...i, paid: false }));

        setStore((prev) => ({
          ...prev,
          activeMonth: newMonthInput,
          months: {
            ...prev.months,
            [newMonthInput]: template
          }
        }));
        setNewMonthInput('');
      };

      const handleDeleteMonth = (ym) => {
        const keys = Object.keys(store.months);
        if (keys.length <= 1) {
          alert('ต้องมีข้อมูลอย่างน้อย 1 เดือนในระบบ');
          return;
        }
        if (!confirm(`ต้องการลบข้อมูลเดือน ${formatMonthLabel(ym)} ใช่หรือไม่?`)) return;

        setStore((prev) => {
          const nextMonths = { ...prev.months };
          delete nextMonths[ym];
          const remainingKeys = Object.keys(nextMonths).sort();
          const nextActive = prev.activeMonth === ym ? remainingKeys[remainingKeys.length - 1] : prev.activeMonth;
          return {
            ...prev,
            activeMonth: nextActive,
            months: nextMonths
          };
        });
      };

      // ==========================================
      // หน้าบังคับกรอก URL Google Apps Script ก่อนเข้าใช้งาน
      // ==========================================
      if (!isConnected) {
        return (
          <div className="min-h-screen bg-[#090d16] flex items-center justify-center p-4">
            <div className="w-full max-w-lg bg-[#111827] border border-gray-800 rounded-2xl p-8 shadow-2xl">
              <div className="flex items-center gap-3 mb-4">
                <div className="w-12 h-12 rounded-xl bg-blue-600/20 border border-blue-500/40 flex items-center justify-center text-2xl">
                  🔗
                </div>
                <div>
                  <h1 className="text-xl font-bold text-white">เชื่อมต่อฐานข้อมูล Google Apps Script</h1>
                  <p className="text-xs text-gray-400">ซิงค์ข้อมูลทุกตัวเลขและข้อมูลย้อนหลังทุกเดือนแบบ Auto-Save 100%</p>
                </div>
              </div>

              <div className="bg-gray-900/90 border border-gray-800 rounded-xl p-4 mb-6 text-xs text-gray-300 space-y-1.5 leading-relaxed">
                <div className="font-semibold text-blue-400 mb-1">💡 วิธีใช้งานข้ามอุปกรณ์ (คอมพิวเตอร์ & มือถือ):</div>
                <p>1. นำ <b>Web App URL</b> ที่ได้จากการ Deploy Google Apps Script (ลงท้ายด้วย <code className="text-amber-400">/exec</code>) มาวางด้านล่าง</p>
                <p>2. เมื่อเปิดในเครื่องอื่นหรือมือถือ เพียงใส่ <b>URL เดียวกันนี้</b> ระบบจะดึงข้อมูลทุกตัวเลขมาแสดงตรงกัน 100% ทันที</p>
              </div>

              <form
                onSubmit={(e) => {
                  e.preventDefault();
                  connectAndFetchCloudData(inputUrl);
                }}
                className="space-y-4"
              >
                <div>
                  <label className="block text-xs font-medium text-gray-300 mb-2">
                    Google Apps Script Web App URL (บังคับกรอก)
                  </label>
                  <input
                    type="url"
                    required
                    placeholder="https://script.google.com/macros/s/xxxxxx/exec"
                    value={inputUrl}
                    onChange={(e) => setInputUrl(e.target.value)}
                    className="w-full bg-[#1f2937] border border-gray-700 focus:border-blue-500 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-500 outline-none transition"
                  />
                </div>

                {urlError && (
                  <div className="bg-red-500/10 border border-red-500/40 text-red-400 text-xs rounded-xl p-3">
                    ⚠️ {urlError}
                  </div>
                )}

                <button
                  type="submit"
                  disabled={isConnecting}
                  className="w-full bg-blue-600 hover:bg-blue-500 disabled:bg-blue-800 text-white font-semibold py-3 px-4 rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-blue-600/20"
                >
                  {isConnecting ? (
                    <>
                      <span className="animate-spin h-4 w-4 border-2 border-white border-t-transparent rounded-full"></span>
                      กำลังเชื่อมต่อและดึงข้อมูลจาก Google Sheets...
                    </>
                  ) : (
                    <>🚀 เชื่อมต่อและซิงค์ข้อมูลทันที</>
                  )}
                </button>
              </form>
            </div>
          </div>
        );
      }

      // ==========================================
      // Component หลอดพลังเพดานงบ สไตล์ Dark SaaS UI
      // ==========================================
      const renderSaaSProgressBar = (title, currentAmt, currentPct, limitPct, onLimitChange, overAmt, overPct, barColorClass) => {
        const isOver = currentPct > limitPct;
        const safeMarkerLeft = Math.min(Math.max(Number(limitPct) || 0, 0), 100);
        const safeFillWidth = Math.min(Math.max(currentPct, 0), 100);

        return (
          <div className={`mt-4 p-4 rounded-xl border transition-all ${
            isOver
              ? 'bg-red-950/25 border-red-500/50'
              : 'bg-[#161f30] border-gray-800'
          }`}>
            <div className="flex flex-wrap justify-between items-center gap-2 mb-3">
              <div className="flex items-center gap-2">
                <span className="text-xs font-semibold text-gray-300">{title}</span>
                <span className={`text-xs font-bold px-2 py-0.5 rounded-full ${
                  isOver ? 'bg-red-500/20 text-red-400 border border-red-500/30' : 'bg-blue-500/20 text-blue-400'
                }`}>
                  ใช้ไป {currentPct.toFixed(2)}% ของรายได้
                </span>
              </div>

              <div className="flex items-center gap-2 text-xs">
                <span className="text-gray-400">ตั้งเพดานงบ:</span>
                <div className="flex items-center bg-[#0b0f19] border border-amber-500/40 rounded-lg px-2 py-1">
                  <input
                    type="number"
                    min="0"
                    max="100"
                    step="1"
                    value={limitPct}
                    onChange={(e) => onLimitChange(Number(e.target.value))}
                    className="w-12 bg-transparent text-amber-400 font-bold text-right outline-none"
                  />
                  <span className="text-amber-400 font-bold ml-1">%</span>
                </div>
                <span className="text-gray-400">
                  (฿{formatMoney((totalIncome * (Number(limitPct) || 0)) / 100)})
                </span>
              </div>
            </div>

            {/* หลอดพลัง + เส้นขีดสีเหลืองบอกตำแหน่งเพดาน */}
            <div className="relative pt-5 pb-2">
              {/* ป้ายบอกตำแหน่งเพดานสีเหลือง */}
              <div
                className="absolute top-0 -translate-x-1/2 z-20 flex flex-col items-center transition-all duration-300"
                style={{ left: `${safeMarkerLeft}%` }}
              >
                <span className="text-[10px] font-bold bg-amber-400 text-gray-950 px-1.5 py-0.5 rounded shadow">
                  เพดาน {limitPct}%
                </span>
              </div>

              {/* พื้นหลังหลอดพลัง */}
              <div className="w-full h-4 bg-gray-800 rounded-full overflow-hidden relative border border-gray-700">
                <div
                  className={`h-full transition-all duration-500 rounded-full ${
                    isOver ? 'bg-gradient-to-r from-red-600 to-rose-500' : barColorClass
                  }`}
                  style={{ width: `${safeFillWidth}%` }}
                />
              </div>

                              onDrop={(e) => onDrop(e, 'investments', idx)}
                              onDragEnd={onDragEnd}
                              className={`border-b border-gray-800/60 hover:bg-gray-800/30 transition ${isOver ? 'drag-row-over' : ''}`}
                            >
                              <td className="py-2.5 px-2">
                                <div className="flex items-center gap-1.5">
                                  <span className="cursor-grab active:cursor-grabbing text-gray-500 hover:text-gray-200 px-1.5 py-0.5 rounded select-none text-base">
                                    ☰
                                  </span>
                                  <span className="text-xs text-gray-500">{idx + 1}</span>
                                </div>
                              </td>
                              <td className="py-2.5 px-3">
                                <input
                                  type="text"
                                  value={item.name}
                                  onChange={(e) => handleUpdateItem('investments', item.id, 'name', e.target.value)}
                                  className="w-full bg-transparent border border-transparent focus:border-gray-700 focus:bg-[#1f2937] rounded-lg px-2.5 py-1.5 text-white outline-none"
                                />
                              </td>
                              <td className="py-2.5 px-3 text-right font-medium text-purple-400">
                                {sharePct.toFixed(2)}%
                              </td>
                              <td className="py-2.5 px-3 text-right">
                                <input
                                  type="number"
                                  step="any"
                                  value={item.amount}
                                  onChange={(e) => handleUpdateItem('investments', item.id, 'amount', parseFloat(e.target.value) || 0)}
                                  className="w-36 bg-[#0b0f19] border border-gray-700 focus:border-purple-500 rounded-lg px-3 py-1.5 text-right text-white font-semibold outline-none"
                                />
                              </td>
                              <td className="py-2.5 px-2 text-center">
                                <input
                                  type="checkbox"
                                  checked={!!item.paid}
                                  onChange={(e) => handleUpdateItem('investments', item.id, 'paid', e.target.checked)}
                                  className="w-4 h-4 accent-purple-500 rounded cursor-pointer"
                                />
                              </td>
                              <td className="py-2.5 px-2 text-center">
                                <button
                                  onClick={() => handleDeleteItem('investments', item.id)}
                                  className="text-gray-500 hover:text-red-400 transition"
                                >
                                  🗑️
                                </button>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                      <tfoot>
                        <tr className="bg-[#0b0f19]/60 font-bold">
                          <td colSpan="3" className="py-3 px-4 text-gray-300">รวมเงินลงทุนทั้งหมด</td>
                          <td className="py-3 px-3 text-right text-purple-400 text-base">฿{formatMoney(totalInvestment)}</td>
                          <td colSpan="2"></td>
                        </tr>
                      </tfoot>
                    </table>
                  </div>
                </section>

                {/* ========================================== */}
                {/* หัวข้อที่ 4: รวมรายจ่ายและรายจ่ายพิเศษ */}
                {/* ========================================== */}
                <section className="bg-[#111827] border border-gray-800 rounded-2xl p-5 shadow-lg">
                  <div className="flex flex-wrap justify-between items-center gap-2 mb-4">
                    <div>
                      <h2 className="text-base sm:text-lg font-bold text-rose-400">4. รวมรายจ่ายและรายจ่ายพิเศษ</h2>
                      <p className="text-xs text-gray-400">ซิงค์ยอดข้อ 2 + ข้อ 3 อัตโนมัติ และเพิ่มรายจ่ายพิเศษได้ (ไม่มีหลอดพลัง)</p>
                    </div>
                    <button
                      onClick={() => handleAddItem('specials', 'รายจ่ายพิเศษใหม่')}
                      className="bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-3.5 py-2 rounded-xl transition"
                    >
                      + เพิ่มรายจ่ายพิเศษ
                    </button>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left border-collapse text-sm">
                      <thead>
                        <tr className="border-b border-gray-800 text-xs text-gray-400">
                          <th className="py-2.5 px-2 w-16">#</th>
                          <th className="py-2.5 px-3">รายการรวมรายจ่ายและรายจ่ายพิเศษ</th>
                          <th className="py-2.5 px-3 text-right w-28">สัดส่วนรายได้</th>
                          <th className="py-2.5 px-3 text-right w-44">จำนวนเงิน (฿)</th>
                          <th className="py-2.5 px-2 text-center w-20">สถานะ</th>
                          <th className="py-2.5 px-2 text-center w-12">ลบ</th>
                        </tr>
                      </thead>
                      <tbody>
                        {/* แถวซิงค์อัตโนมัติจากข้อ 2 และ ข้อ 3 */}
                        <tr className="border-b border-gray-800/60 bg-amber-500/5">
                          <td className="py-2.5 px-3 text-xs text-amber-400 font-bold">Auto</td>
                          <td className="py-2.5 px-3 font-medium text-amber-300">
                            รวมยอดจากข้อ 2. รายจ่ายจำเป็น
                          </td>
                          <td className="py-2.5 px-3 text-right text-amber-400 font-medium">
                            {essentialPct.toFixed(2)}%
                          </td>
                          <td className="py-2.5 px-3 text-right font-bold text-amber-400">
                            ฿{formatMoney(totalEssential)}
                          </td>
                          <td className="py-2.5 px-2 text-center text-xs text-gray-400">ซิงค์อัตโนมัติ</td>
                          <td></td>
                        </tr>

                        <tr className="border-b border-gray-800/60 bg-purple-500/5">
                          <td className="py-2.5 px-3 text-xs text-purple-400 font-bold">Auto</td>
                          <td className="py-2.5 px-3 font-medium text-purple-300">
                            รวมยอดจากข้อ 3. เงินลงทุน
                          </td>
                          <td className="py-2.5 px-3 text-right text-purple-400 font-medium">
                            {investmentPct.toFixed(2)}%
                          </td>
                          <td className="py-2.5 px-3 text-right font-bold text-purple-400">
                            ฿{formatMoney(totalInvestment)}
                          </td>
                          <td className="py-2.5 px-2 text-center text-xs text-gray-400">ซิงค์อัตโนมัติ</td>
                          <td></td>
                        </tr>

                        {/* รายการรายจ่ายพิเศษที่ลากสลับตำแหน่งได้ */}
                        {(currentData.specials || []).map((item, idx) => {
                          const sharePct = totalIncome > 0 ? ((Number(item.amount) || 0) / totalIncome) * 100 : 0;
                          const isOver = dragInfo.section === 'specials' && dragInfo.overIndex === idx;
                          return (
                            <tr
                              key={item.id}
                              draggable
                              onDragStart={(e) => onDragStart(e, 'specials', idx)}
                              onDragOver={(e) => onDragOver(e, 'specials', idx)}
                              onDrop={(e) => onDrop(e, 'specials', idx)}
                              onDragEnd={onDragEnd}
                              className={`border-b border-gray-800/60 hover:bg-gray-800/30 transition ${isOver ? 'drag-row-over' : ''}`}
                            >
                              <td className="py-2.5 px-2">
                                <div className="flex items-center gap-1.5">
                                  <span className="cursor-grab active:cursor-grabbing text-gray-500 hover:text-gray-200 px-1.5 py-0.5 rounded select-none text-base">
                                    ☰
                                  </span>
                                  <span className="text-xs text-gray-500">{idx + 1}</span>
                                </div>
                              </td>
                              <td className="py-2.5 px-3">
                                <input
                                  type="text"
                                  value={item.name}
                                  onChange={(e) => handleUpdateItem('specials', item.id, 'name', e.target.value)}
                                  className="w-full bg-transparent border border-transparent focus:border-gray-700 focus:bg-[#1f2937] rounded-lg px-2.5 py-1.5 text-white outline-none"
                                />
                              </td>
                              <td className="py-2.5 px-3 text-right font-medium text-rose-400">
                                {sharePct.toFixed(2)}%
                              </td>
                              <td className="py-2.5 px-3 text-right">
                                <input
                                  type="number"
                                  step="any"
                                  value={item.amount}
                                  onChange={(e) => handleUpdateItem('specials', item.id, 'amount', parseFloat(e.target.value) || 0)}
                                  className="w-36 bg-[#0b0f19] border border-gray-700 focus:border-rose-500 rounded-lg px-3 py-1.5 text-right text-white font-semibold outline-none"
                                />
                              </td>
                              <td className="py-2.5 px-2 text-center">
                                <input
                                  type="checkbox"
                                  checked={!!item.paid}
                                  onChange={(e) => handleUpdateItem('specials', item.id, 'paid', e.target.checked)}
                                  className="w-4 h-4 accent-rose-500 rounded cursor-pointer"
                                />
                              </td>
                              <td className="py-2.5 px-2 text-center">
                                <button
                                  onClick={() => handleDeleteItem('specials', item.id)}
                                  className="text-gray-500 hover:text-red-400 transition"
                                >
                                  🗑️
                                </button>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                      <tfoot>
                        <tr className="bg-[#0b0f19]/80 font-bold border-t border-gray-700">
                          <td colSpan="3" className="py-3 px-4 text-gray-200">
                            รวมรายจ่ายทั้งหมดของเดือนนี้ (ข้อ 2 + ข้อ 3 + รายจ่ายพิเศษ)
                          </td>
                          <td className="py-3 px-3 text-right text-rose-400 text-base">
                            ฿{formatMoney(totalAllExpenses)}
                          </td>
                          <td colSpan="2"></td>
                        </tr>
                        <tr className="bg-blue-950/30 font-bold">
                          <td colSpan="3" className="py-3 px-4 text-blue-300">
                            เงินคงเหลือสุทธิ (1. รายได้ - 4. รวมรายจ่ายทั้งหมด)
                          </td>
                          <td className={`py-3 px-3 text-right text-lg ${netBalance >= 0 ? 'text-emerald-400' : 'text-red-400'}`}>
                            ฿{formatMoney(netBalance)}
                          </td>
                          <td colSpan="2"></td>
                        </tr>
                      </tfoot>
                    </table>
                  </div>
                </section>
              </div>
            ) : (
              /* ========================================== */
              /* หน้าสรุปรายเดือน & กราฟแท่งเปรียบเทียบทุกเดือน */
              /* ========================================== */
              <div className="space-y-6">
                <section className="bg-[#111827] border border-gray-800 rounded-2xl p-6 shadow-lg">
                  <div className="flex flex-wrap justify-between items-center gap-2 mb-6">
                    <div>
                      <h2 className="text-lg font-bold text-white">📊 กราฟแท่งเปรียบเทียบรายรับ • รายจ่าย • เงินคงเหลือทั้งหมด</h2>
                      <p className="text-xs text-gray-400">เปรียบเทียบข้อมูลย้อนหลังแต่ละเดือน (คลิกที่แท่งกราฟเพื่อเปิดแก้ไขเดือนนั้นได้ทันที)</p>
                    </div>
                    <div className="flex items-center gap-4 text-xs">
                      <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded bg-emerald-500 inline-block"></span> 1. รายได้รวม</span>
                      <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded bg-rose-500 inline-block"></span> 4. รายจ่ายรวมทั้งหมด</span>
                      <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded bg-blue-500 inline-block"></span> เงินคงเหลือสุทธิ</span>
                    </div>
                  </div>

                  {/* กราฟแท่งเปรียบเทียบรายเดือน */}
                  {(() => {
                    const summaryList = sortedMonthKeys.map((ym) => {
                      const m = store.months[ym] || createDefaultMonthData();
                      const inc = (m.incomes || []).reduce((s, i) => s + (Number(i.amount) || 0), 0);
                      const ess = (m.essentials || []).reduce((s, i) => s + (Number(i.amount) || 0), 0);
                      const inv = (m.investments || []).reduce((s, i) => s + (Number(i.amount) || 0), 0);
                      const spc = (m.specials || []).reduce((s, i) => s + (Number(i.amount) || 0), 0);
                      const exp = ess + inv + spc;
                      const net = inc - exp;
                      return { ym, inc, ess, inv, spc, exp, net };
                    });

                    const maxVal = Math.max(
                      1,
                      ...summaryList.flatMap((d) => [d.inc, d.exp, Math.abs(d.net)])
                    );

                    return (
                      <div className="space-y-6">
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                          {summaryList.map((item) => {
                            const incH = Math.round((item.inc / maxVal) * 100);
                            const expH = Math.round((item.exp / maxVal) * 100);
                            const netH = Math.round((Math.abs(item.net) / maxVal) * 100);

                            return (
                              <div
                                key={item.ym}
                                onClick={() => {
                                  setStore((prev) => ({ ...prev, activeMonth: item.ym }));
                                  setActiveTab('tables');
                                }}
                                className={`cursor-pointer p-4 rounded-xl border transition hover:border-blue-500/60 bg-[#0b0f19] ${
                                  item.ym === activeMonth ? 'border-blue-500' : 'border-gray-800'
                                }`}
                              >
                                <div className="flex justify-between items-center mb-3">
                                  <span className="text-sm font-bold text-white">{formatMonthLabel(item.ym)}</span>
                                  <span className="text-[11px] text-blue-400">คลิกดูรายละเอียด →</span>
                                </div>

                                {/* แท่งกราฟ 3 แท่ง */}
                                <div className="h-40 flex items-end justify-around gap-3 pt-6 pb-2 px-4 bg-[#111827] rounded-xl border border-gray-800/80">
                                  <div className="flex flex-col items-center w-full h-full justify-end">
                                    <span className="text-[10px] text-emerald-400 font-semibold mb-1">
                                      ฿{formatMoney(item.inc)}
                                    </span>
                                    <div
                                      className="w-full max-w-[38px] bg-emerald-500 rounded-t-lg transition-all duration-500"
                                      style={{ height: `${Math.max(incH, 4)}%` }}
                                    ></div>
                                    <span className="text-[10px] text-gray-400 mt-1.5">รายรับ</span>
                                  </div>

                                  <div className="flex flex-col items-center w-full h-full justify-end">
                                    <span className="text-[10px] text-rose-400 font-semibold mb-1">
                                      ฿{formatMoney(item.exp)}
                                    </span>
                                    <div
                                      className="w-full max-w-[38px] bg-rose-500 rounded-t-lg transition-all duration-500"
                                      style={{ height: `${Math.max(expH, 4)}%` }}
                                    ></div>
                                    <span className="text-[10px] text-gray-400 mt-1.5">รายจ่ายรวม</span>
                                  </div>

                                  <div className="flex flex-col items-center w-full h-full justify-end">
                                    <span className={`text-[10px] font-semibold mb-1 ${item.net >= 0 ? 'text-blue-400' : 'text-red-400'}`}>
                                      ฿{formatMoney(item.net)}
                                    </span>
                                    <div
                                      className={`w-full max-w-[38px] rounded-t-lg transition-all duration-500 ${
                                        item.net >= 0 ? 'bg-blue-500' : 'bg-red-600'
                                      }`}
                                      style={{ height: `${Math.max(netH, 4)}%` }}
                                    ></div>
                                    <span className="text-[10px] text-gray-400 mt-1.5">คงเหลือ</span>
                                  </div>
                                </div>
                              </div>
                            );
                          })}
                        </div>

                        {/* ตารางสรุปเปรียบเทียบทุกเดือน */}
                        <div className="overflow-x-auto mt-6">
                          <table className="w-full text-left border-collapse text-sm">
                            <thead>
                              <tr className="border-b border-gray-800 text-xs text-gray-400">
                                <th className="py-3 px-3">เดือน/ปี</th>
                                <th className="py-3 px-3 text-right">1. รายได้รวม</th>
                                <th className="py-3 px-3 text-right">2. รายจ่ายจำเป็น</th>
                                <th className="py-3 px-3 text-right">3. เงินลงทุน</th>
                                <th className="py-3 px-3 text-right">รายจ่ายพิเศษ</th>
                                <th className="py-3 px-3 text-right">4. รวมรายจ่ายทั้งหมด</th>
                                <th className="py-3 px-3 text-right">เงินคงเหลือสุทธิ</th>
                              </tr>
                            </thead>
                            <tbody>
                              {summaryList.map((row) => (
                                <tr
                                  key={row.ym}
                                  onClick={() => {
                                    setStore((prev) => ({ ...prev, activeMonth: row.ym }));
                                    setActiveTab('tables');
                                  }}
                                  className="border-b border-gray-800/60 hover:bg-gray-800/40 cursor-pointer transition"
                                >
                                  <td className="py-3 px-3 font-semibold text-white">{formatMonthLabel(row.ym)}</td>
                                  <td className="py-3 px-3 text-right text-emerald-400 font-medium">฿{formatMoney(row.inc)}</td>
                                  <td className="py-3 px-3 text-right text-amber-400">฿{formatMoney(row.ess)}</td>
                                  <td className="py-3 px-3 text-right text-purple-400">฿{formatMoney(row.inv)}</td>
                                  <td className="py-3 px-3 text-right text-gray-300">฿{formatMoney(row.spc)}</td>
                                  <td className="py-3 px-3 text-right text-rose-400 font-semibold">฿{formatMoney(row.exp)}</td>
                                  <td className={`py-3 px-3 text-right font-bold ${row.net >= 0 ? 'text-blue-400' : 'text-red-400'}`}>
                                    ฿{formatMoney(row.net)}
                                  </td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    );
                  })()}
                </section>
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
